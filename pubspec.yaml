name: extron_configurator
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^4.0.9
  auris: ^0.2.0
  dartssh2: ^2.17.1
  file_picker: ^11.0.2
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  path: ^1.9.1
  pdfrx: ^2.4.7
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  # Reading an .xlsx back in - see xlsx_reader.dart. Already in the lock
  # file as a transitive dependency; named here because this app now parses
  # spreadsheet XML itself rather than only writing it.
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
